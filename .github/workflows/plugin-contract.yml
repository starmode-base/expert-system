name: Plugin contract

# Tool names, the hosted marketplace copy, and the public policy pages are part
# of the contract consumed by starmode-base/expert-system-plugin. This job runs
# that repository's packaging checks against the server tree in this PR, so a
# rename or removal here fails before it breaks installed plugins.
#
# The plugin is checked out at its default branch. A coordinated breaking change
# that is correct on both sides will fail here until the plugin side merges;
# land the plugin PR first, as documented in AGENTS.md.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out server
        uses: actions/checkout@v4
        with:
          path: expert-system

      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          repository: starmode-base/expert-system-plugin
          path: expert-system-plugin

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
        working-directory: expert-system-plugin

      - run: bun run plugin:check
        working-directory: expert-system-plugin
        env:
          EXPERT_SYSTEM_SERVER_ROOT: ${{ github.workspace }}/expert-system
